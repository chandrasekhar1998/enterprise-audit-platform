[project]
name = "audit-service"
version = "0.1.0"
description = "Enterprise Audit Management Platform - Audit Service"
authors = [
    {name = "chandrasekhar1998",email = "chandrasekhark82@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "dj-database-url (>=3.1.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "coverage (>=7.16.0,<8.0.0)",
    "ruff (>=0.16.5,<0.17.0)"
]
